<title>Estudio de Mercado Este de Miranda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E9EDF4; --ink:#0E1B2E; --muted:#56657C; --line:#D8DEE8;
  --blue:#0B3D91; --blue-soft:#E3EBFA; --red:#D1202E; --red-soft:#FBE6E8;
  --good:#1D7F47; --good-soft:#E1F3E8; --mid:#A8690F; --mid-soft:#FBF0DC; --low:#B8322A; --low-soft:#F9E3E1;
  --gray:#6B7280; --gray-soft:#ECEEF1; --info:#1F5FBF; --info-soft:#E2ECFB;
  --shadow:0 10px 40px rgba(14,27,46,.18);
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0A111E; --surface:#111B2D; --sunk:#0D1626; --ink:#E7EDF6; --muted:#98A6BD; --line:#24324B;
  --blue:#8DB0FF; --blue-soft:#17264A; --red:#FF6470; --red-soft:#3A1720;
  --good:#5BD28E; --good-soft:#123324; --mid:#F0B75A; --mid-soft:#382A12; --low:#FF7B72; --low-soft:#3B1A18;
  --gray:#A0A8B5; --gray-soft:#1C2536; --info:#8DB0FF; --info-soft:#17264A; --shadow:0 10px 40px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A111E; --surface:#111B2D; --sunk:#0D1626; --ink:#E7EDF6; --muted:#98A6BD; --line:#24324B;
  --blue:#8DB0FF; --blue-soft:#17264A; --red:#FF6470; --red-soft:#3A1720;
  --good:#5BD28E; --good-soft:#123324; --mid:#F0B75A; --mid-soft:#382A12; --low:#FF7B72; --low-soft:#3B1A18;
  --gray:#A0A8B5; --gray-soft:#1C2536; --info:#8DB0FF; --info-soft:#17264A; --shadow:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.02em}
.muted{color:var(--muted)}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* Cabecera */
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-block:22px 16px;border-bottom:3px solid var(--ink)}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .mark{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.14em;display:flex;gap:10px;align-items:center}
.mark .r{color:var(--red)} .mark .b{color:var(--blue)}
.mark .who{color:var(--muted);font-weight:600;letter-spacing:.06em}
.brand h1{font-size:clamp(24px,3.4vw,34px);font-weight:800}
.brand h1 span{color:var(--red)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.sync{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray)}
.dot.on{background:var(--good)}

/* Pestañas */
nav.zones{display:flex;gap:4px;overflow-x:auto;margin-top:14px;border-bottom:1px solid var(--line)}
nav.zones button{border:0;background:none;padding:10px 16px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.zones button[aria-selected="true"]{color:var(--ink);border-color:var(--red)}
nav.zones .count{font-family:var(--f-body);font-weight:600;font-size:12px;background:var(--sunk);border-radius:10px;padding:1px 7px;margin-left:6px;color:var(--muted)}
nav.types{display:flex;gap:6px;flex-wrap:wrap;margin-block:16px 12px}
nav.types button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
nav.types button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-block:12px}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:22px;font-weight:700}
.kpi small{color:var(--muted);font-size:12.5px}

/* Filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-block:6px 12px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;font-size:14px;min-width:0}
.filters input[type=search]{width:200px;max-width:100%}
.filters input[type=number]{width:110px}

/* Tabla */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:960px}
th{position:sticky;top:0;background:var(--sunk);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:9px 10px;font-weight:700;white-space:nowrap}
td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
td.mono{white-space:nowrap}
.tt{font-weight:600;line-height:1.25}
.sub{font-size:12.5px;color:var(--muted)}
.empty{padding:32px;text-align:center;color:var(--muted)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-disponible{color:var(--good);background:var(--good-soft)}
.st-negociacion{color:var(--mid);background:var(--mid-soft)}
.st-vendido{color:var(--low);background:var(--low-soft)}
.st-retirado{color:var(--gray);background:var(--gray-soft)}
.st-por_verificar{color:var(--info);background:var(--info-soft)}
.cl-exc{color:var(--good);background:var(--good-soft)}
.cl-med{color:var(--mid);background:var(--mid-soft)}
.cl-baj{color:var(--low);background:var(--low-soft)}
.cl-ref{color:var(--gray);background:var(--gray-soft)}
.op{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.op.alquiler{color:var(--blue);border-color:var(--blue-soft);background:var(--blue-soft)}
.score{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.score b{font-family:var(--f-display);font-size:18px;width:30px;text-align:right}
.bar{width:54px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%}
.delta{font-size:12px;font-weight:700}
.delta.dn{color:var(--good)} .delta.up{color:var(--low)}
.star{color:var(--mid)}
.ok{font-family:var(--f-body);font-size:11.5px;font-weight:700;color:var(--good)}
.mine{font-family:var(--f-body);font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--red);text-transform:uppercase}
.capbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.docs label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}
.docs input{width:auto}
.acm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-block:8px}
.acm div{background:var(--surface);padding:8px 10px}
.acm b{font-family:var(--f-display);font-size:18px;display:block}
.complist{font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.complist button{all:unset;cursor:pointer;color:var(--blue)}
.complist button:focus-visible{outline:2px solid var(--blue)}

/* Panel */
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;margin-top:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:17px;margin-bottom:10px}
.matrix{width:100%;min-width:560px}
.matrix td,.matrix th{padding:8px}
.matrix td{cursor:pointer}
.opp{display:flex;flex-direction:column}
.opp .row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.opp .row:first-child{border-top:0}
.rank{font-family:var(--f-display);font-weight:800;color:var(--muted);width:22px}
.update p{margin:6px 0}
.method li{margin-block:4px}

/* Panel lateral de detalle */
.overlay{position:fixed;inset:0;background:rgba(8,14,26,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);padding-inline:20px;padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 28px)}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:21px}
.statusbar{display:flex;flex-wrap:wrap;gap:6px;margin-block:14px}
.statusbar button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.statusbar button[aria-pressed="true"]{border-color:currentColor}
.sec{margin-top:18px}
.sec h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.form label.wide{grid-column:1/-1}
.form input,.form select,.form textarea{font-weight:400;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 9px;font-size:14px;color:var(--ink);width:100%}
.form textarea{min-height:84px;resize:vertical}
.analysis{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px}
.analysis .big{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.analysis .big b{font-family:var(--f-display);font-size:34px;line-height:1}
.analysis ul{margin:6px 0 0;padding-left:18px}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px;margin-top:8px}
.rate{display:flex;gap:4px}
.rate button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.rate button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.rates{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.hist{font-size:13.5px;border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.src{display:flex;flex-direction:column;gap:6px}
.src .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.src a{color:var(--blue);word-break:break-all}
.dfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--red);font-weight:600}

/* Clientes */
.clients{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;margin-top:16px}
@media (max-width:900px){.clients{grid-template-columns:1fr}}
.clist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.clist button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.clist button[aria-selected="true"]{border-color:var(--blue);background:var(--blue-soft)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{flex-direction:row;align-items:center;gap:5px;font-weight:600;color:var(--ink);font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface)}
.checks input{width:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:40;box-shadow:var(--shadow)}
.notice{background:var(--mid-soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:12px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark"><span><span class="r">RE</span><span class="b">/MAX</span></span><span class="who">EDUARDO LEÓN · ASESOR INMOBILIARIO</span></div>
      <h1>Estudio de Mercado <span>·</span> Este de Miranda</h1>
      <div class="sub">Fuentes: RE/MAX Venezuela · MercadoLibre</div>
    </div>
    <div class="tools">
      <span class="sync" id="sync"><span class="dot" id="syncdot"></span><span id="synctxt">Conectando…</span></span>
      <button class="btn" id="btn-export" type="button">Exportar a Excel</button>
      <button class="btn primary" id="btn-add" type="button">+ Agregar inmueble</button>
    </div>
  </header>
  <nav class="zones" id="zones" role="tablist"></nav>
  <main id="view"></main>
</div>
<div id="drawer-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ───────────── Configuración ───────────── */
const ZONAS = [
  {id:"guatire", nombre:"Guatire", pref:"GTR", sectores:["El Ingenio","Castillejo","Villa Heroica","Buenaventura","Villas de Buenaventura","Valle Arriba","Las Rosas","La Sabana","San Pedro","Frutas Condominio","Terrazas del Ingenio","Valle Grande","El Marqués","Araira","Vega Arriba (Z.I.)","Zona Industrial Terrinca","Zona Industrial Inproceca","Guatire (centro)","Plaza Oro","Las Acacias","Buena Vista","El Encantado","El Refugio","Los Pinos","Canaima II","Las Barrancas","Casco central"]},
  {id:"guarenas", nombre:"Guarenas", pref:"GRN", sectores:["Trapichito","Menca de Leoni","Nueva Casarapa","Ciudad Casarapa","El Naranjal","La Vaquera","Los Girasoles","Ruiz Pineda","Guarenas (centro)","Zona Industrial del Este","Zona Industrial Cloris","Los Naranjos","Terrazas del Este","Oropeza Castillo","El Calvario","Alto Grande (Loma Linda)","Av. Intercomunal Guarenas-Guatire"]},
  {id:"costa", nombre:"Costa Mirandina", pref:"CST", sectores:["Higuerote","Higuerote (Ciudad Balneario)","Higuerote (Agua Sal)","Higuerote (Playa Cristal)","Higuerote (Puerto Encantado)","Higuerote (Jardín Higuerote)","Carenero","Río Chico","Río Chico (Los Canales)","Tacarigua de la Laguna","Tacarigua","Buche","Chirimena","Paparo"]},
];
const TIPOS = [
  {id:"residencial", nombre:"Residencial"},
  {id:"terreno", nombre:"Terrenos"},
  {id:"galpon", nombre:"Galpones"},
  {id:"local", nombre:"Locales"},
];
const ESTATUS = [
  {id:"disponible", nombre:"Disponible"},
  {id:"negociacion", nombre:"En negociación"},
  {id:"vendido", nombre:"Vendido / Alquilado"},
  {id:"retirado", nombre:"Retirado del mercado"},
  {id:"por_verificar", nombre:"Por verificar"},
];
const ACTIVOS = ["disponible","negociacion","por_verificar"];
const SPECS = {
  residencial:[["niveles","Niveles"],["piso","Piso"],["ascensor","Ascensor"],["amoblado","Amoblado"],["agua","Agua (pozo / tanque)"],["planta_electrica","Planta eléctrica"],["vigilancia","Vigilancia"],["areas_comunes","Áreas comunes"],["condominio","Condominio mensual"],["estado_obra","Estado de la obra"],["vista","Vista"],["anexo","Anexo"],["extras","Extras"]],
  terreno:[["zonificacion","Zonificación"],["topografia","Topografía"],["frente_fondo","Frente × fondo"],["servicios","Servicios"],["acceso","Acceso vial"],["uso","Uso permitido"],["proyecto","Proyecto / permisos"]],
  galpon:[["altura_libre","Altura libre"],["electricidad","Electricidad (trifásica / KVA)"],["acceso_gandolas","Acceso de gandolas"],["patio_maniobras","Patio de maniobras"],["oficinas","Oficinas"],["montacarga","Montacarga"],["vigilancia","Vigilancia"],["divisible","Divisible"],["naves","Naves"],["estacionamiento","Estacionamiento"],["edificacion","Edificación"]],
  local:[["ubicacion","Ubicación (C.C. / pie de calle)"],["nivel","Nivel"],["vidriera","Frente de vidriera"],["flujo","Flujo de personas"],["mezzanina","Mezzanina"],["fondo_comercio","Fondo de comercio"],["composicion","Composición"],["estado_obra","Estado de la obra"]],
};
const CRIT = [
  ["precio","Precio por m² vs. su sector"],["ubicacion","Ubicación y demanda"],["estado","Estado y servicios"],
  ["rentabilidad","Rentabilidad por alquiler"],["liquidez","Liquidez (rapidez de venta)"],["documentacion","Documentación y riesgo"],
];
const PERFILES = {
  general:   {nombre:"General",                       w:{precio:.35,ubicacion:.20,estado:.15,rentabilidad:.10,liquidez:.10,documentacion:.10}},
  renta:     {nombre:"Renta (alquiler)",              w:{precio:.25,ubicacion:.15,estado:.15,rentabilidad:.30,liquidez:.05,documentacion:.10}},
  plusvalia: {nombre:"Plusvalía (largo plazo)",       w:{precio:.25,ubicacion:.35,estado:.10,rentabilidad:.05,liquidez:.15,documentacion:.10}},
  reventa:   {nombre:"Comprar, remodelar y revender", w:{precio:.45,ubicacion:.15,estado:.05,rentabilidad:0,liquidez:.25,documentacion:.10}},
  propio:    {nombre:"Uso propio / vivienda",         w:{precio:.25,ubicacion:.25,estado:.30,rentabilidad:0,liquidez:.10,documentacion:.10}},
  desarrollo:{nombre:"Desarrollador / constructor",   w:{precio:.40,ubicacion:.30,estado:0,rentabilidad:.05,liquidez:.10,documentacion:.15}},
};
const FIRMA = "Eduardo León · Asesor Inmobiliario RE/MAX";
/* Mis captaciones: inmuebles que Eduardo tiene en cartera. Viven en la misma colección
   (propia: true) para que cuenten como comparables y aparezcan a los clientes. */
const EST_CAP = [
  {id:"preparacion", nombre:"En preparación", st:"disponible", c:"por_verificar"},
  {id:"publicada",   nombre:"Publicada",      st:"disponible", c:"disponible"},
  {id:"ofertas",     nombre:"Con ofertas",    st:"disponible", c:"negociacion"},
  {id:"negociacion", nombre:"En negociación", st:"negociacion", c:"negociacion"},
  {id:"cerrada",     nombre:"Vendida / Alquilada", st:"vendido", c:"vendido"},
  {id:"vencida",     nombre:"Vencida / Retirada",  st:"retirado", c:"retirado"},
];
const CAP_ACTIVAS = ["preparacion","publicada","ofertas","negociacion"];
const DOCS = [
  ["contrato","Contrato de captación firmado"],["propiedad","Documento de propiedad"],["cedula","Cédula del propietario"],
  ["catastral","Cédula / ficha catastral"],["solvencias","Solvencias (municipal, servicios)"],["condominio","Solvencia de condominio"],
  ["planos","Planos o croquis"],["fotos","Fotos profesionales"],
];
const ACTIVIDAD = ["Visita","Llamada","Oferta","Publicación","Rebaja de precio","Otro"];
const capNom = id => (EST_CAP.find(e=>e.id===id)||{}).nombre || id;
const capClase = id => (EST_CAP.find(e=>e.id===id)||{}).c || "por_verificar";

/* ───────────── Estado ───────────── */
const S = {
  items:[], clientes:[], meta:null, db:null, dl:null, ready:false,
  tab:"panel", tipo:"residencial",
  f:{q:"", op:"todas", st:"activos", sector:"", min:"", max:"", orden:"puntaje"},
  sel:null, cliente:null, pick:new Set(),
};

/* ───────────── Utilidades ───────────── */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = n => n==null||n==="" ? "—" : "$" + Math.round(n).toLocaleString("es-VE");
const fmt = n => n==null||n==="" ? "—" : Number(n).toLocaleString("es-VE");
const hoy = () => new Date().toISOString().slice(0,10);
const zonaNom = id => (ZONAS.find(z=>z.id===id)||{}).nombre || id;
const tipoNom = id => (TIPOS.find(t=>t.id===id)||{}).nombre || id;
const stNom = id => (ESTATUS.find(s=>s.id===id)||{}).nombre || id;
const dias = f => f ? Math.max(0, Math.round((Date.now() - new Date(f+"T00:00:00").getTime())/864e5)) : null;
const diasHasta = f => f ? Math.round((new Date(f+"T00:00:00").getTime() - Date.now())/864e5) : null;
const median = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); const m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

function area(it){
  if(it.tipo==="terreno") return it.m2t || null;
  if(it.tipo==="galpon") return it.m2c || it.m2t || null;
  return it.m2c || null;
}
function ppm2(it){ const a=area(it); return (it.operacion==="venta" && it.precio && a) ? it.precio/a : null; }

const familia = it => /casa|town|quinta|villa/i.test(it.subtipo||"") ? "casas" : "apartamentos";
/* Mediana de $/m² de los comparables: mismo tipo y zona (y sector si hay 3+). */
function comparables(it){
  // En residencial se comparan casas con casas y apartamentos con apartamentos.
  const base = S.items.filter(o => o.operacion==="venta" && o.tipo===it.tipo && ppm2(o)!=null && (it.tipo!=="residencial" || familia(o)===familia(it)));
  const sec = base.filter(o => o.zona===it.zona && o.sector===it.sector);
  if(sec.length>=3) return {vals:sec.map(ppm2), ambito:"sector " + it.sector};
  const zon = base.filter(o => o.zona===it.zona);
  if(zon.length>=3) return {vals:zon.map(ppm2), ambito:(it.tipo==="residencial"?familia(it):tipoNom(it.tipo).toLowerCase()) + " en " + zonaNom(it.zona)};
  if(base.length>=3) return {vals:base.map(ppm2), ambito:(it.tipo==="residencial"?familia(it):tipoNom(it.tipo).toLowerCase()) + " de las 3 zonas"};
  return null;
}

/* Análisis comparativo para fijar precio: $/m² de inmuebles parecidos (sin contar el propio). */
function acm(it){
  const a = area(it); if(!a || it.operacion!=="venta") return null;
  const base = S.items.filter(o => o.id!==it.id && o.operacion==="venta" && o.tipo===it.tipo && ppm2(o)!=null && (it.tipo!=="residencial" || familia(o)===familia(it)));
  let g = base.filter(o=>o.zona===it.zona && o.sector===it.sector), amb = "su sector";
  if(g.length<3){ g = base.filter(o=>o.zona===it.zona); amb = zonaNom(it.zona); }
  if(g.length<3){ g = base; amb = "las 3 zonas"; }
  if(g.length<2) return {pocos:true, n:g.length};
  const v = g.map(ppm2).sort((x,y)=>x-y), q = f => { const i=(v.length-1)*f, lo=Math.floor(i), hi=Math.ceil(i); return v[lo]+(v[hi]-v[lo])*(i-lo); };
  const med = q(.5);
  const lista = g.slice().sort((x,y)=>(y.sector===it.sector)-(x.sector===it.sector) || Math.abs(ppm2(x)-med)-Math.abs(ppm2(y)-med)).slice(0,5);
  return {n:g.length, amb, area:a, p25:q(.25), med, p75:q(.75), sugerido:med*a, lo:q(.25)*a, hi:q(.75)*a, lista};
}
function evaluar(it, perfil="general"){
  if(it.operacion!=="venta") return {ref:true};
  if(it.precio==null || it.precio==="") return {falta:true};
  const w = PERFILES[perfil].w, c = it.cal || {};
  const sub = {}; let ratio=null, comp=null;
  const p = ppm2(it);
  if(p!=null){ comp = comparables(it); if(comp){ const m=median(comp.vals); ratio=p/m; comp.med=m; comp.n=comp.vals.length;
    sub.precio = Math.max(0, Math.min(100, 100 - (ratio-0.6)*125)); } }
  for(const k of ["ubicacion","estado","rentabilidad","liquidez","documentacion"]) sub[k] = ((c[k]||3)-1)*25;
  let tot=0, ws=0;
  for(const [k] of CRIT){ if(sub[k]==null || !w[k]) continue; tot+=sub[k]*w[k]; ws+=w[k]; }
  const score = ws? Math.round(tot/ws) : null;
  const clase = score>=75?"exc":score>=50?"med":"baj";
  return {score, clase, sub, ratio, comp, sinPrecio: sub.precio==null};
}
const claseNom = {exc:"Excelente", med:"Media", baj:"Baja"};
const claseColor = {exc:"var(--good)", med:"var(--mid)", baj:"var(--low)"};

function analisis(it, ev){
  if(ev.ref) return ["Es un alquiler: sirve de referencia para calcular la renta de los inmuebles en venta del mismo sector."];
  if(ev.falta) return ["Falta el precio. Ábrelo en la plataforma, anota el precio y los m² y el puntaje se calcula solo."];
  const out = [];
  if(ev.ratio!=null){
    const pct = Math.round((ev.ratio-1)*100);
    out.push(`${usd(ppm2(it))}/m²: ${pct<0? Math.abs(pct)+"% por debajo" : pct>0? pct+"% por encima":"igual a"} de la mediana de ${ev.comp.ambito} (${usd(ev.comp.med)}/m², ${ev.comp.n} comparables).`);
  } else out.push("Sin precio por m² comparable (faltan m² o comparables). El puntaje usa solo los demás criterios.");
  const c = it.cal||{}, fu=[], de=[];
  const nom = {ubicacion:"ubicación",estado:"estado y servicios",rentabilidad:"potencial de renta",liquidez:"liquidez",documentacion:"documentación"};
  for(const k in nom){ if((c[k]||3)>=4) fu.push(nom[k]); if((c[k]||3)<=2) de.push(nom[k]); }
  if(fu.length) out.push("A favor: " + fu.join(", ") + ".");
  if(de.length) out.push("En contra: " + de.join(", ") + ".");
  return out;
}

/* ───────────── Base de datos ───────────── */
function setSync(on, txt){ $("#syncdot").className = "dot" + (on?" on":""); $("#synctxt").textContent = txt; }
async function iniciar(){
  render();
  if(!window.claude || !window.claude.use){ setSync(false,"Sin conexión a la base de datos"); S.ready=true; render(); return; }
  const db = await window.claude.use("db");
  S.dl = await window.claude.use("downloads");
  if(!db){ setSync(false,"Base de datos no disponible en esta vista"); S.ready=true; render(); return; }
  S.db = db;
  db.collection("inmuebles").onSnapshot(snap => {
    S.items = snap.docs.map(d => ({...d.data(), id:d.id}));
    S.ready = true; setSync(true, "Guardado en la nube · " + S.items.length + " inmuebles");
    render(); if(S.sel) pintarDrawer();
  }, e => setSync(false, "Error de conexión: " + e.code));
  db.collection("clientes").onSnapshot(snap => { S.clientes = snap.docs.map(d=>({...d.data(), id:d.id})); if(S.tab==="clientes") render(); }, ()=>{});
  db.doc("meta/estado").onSnapshot(s => { S.meta = s.exists ? s.data() : null; if(S.tab==="panel") render(); }, ()=>{});
}
async function guardar(it){
  if(!S.db){ toast("No hay base de datos: el cambio no se guardó"); return false; }
  const body = JSON.parse(JSON.stringify(it)); delete body.id;
  try{ await S.db.collection("inmuebles").doc(it.id).set(body); return true; }
  catch(e){ toast(e.code==="invalid_argument" ? "No tienes permiso para guardar cambios" : "No se pudo guardar: " + e.code); return false; }
}

/* ───────────── Render principal ───────────── */
function render(){
  const tabs = [{id:"panel",nombre:"Panel general"}, ...ZONAS.map(z=>({id:z.id,nombre:z.nombre})), {id:"captaciones",nombre:"Mis captaciones"}, {id:"clientes",nombre:"Clientes e inversionistas"}];
  $("#zones").innerHTML = tabs.map(t => {
    const n = ZONAS.some(z=>z.id===t.id) ? S.items.filter(i=>i.zona===t.id && !i.propia && ACTIVOS.includes(i.estatus)).length
      : t.id==="captaciones" ? S.items.filter(i=>i.propia && CAP_ACTIVAS.includes(i.captacion?.estado)).length : null;
    return `<button role="tab" aria-selected="${S.tab===t.id}" data-tab="${t.id}">${esc(t.nombre)}${n!=null?`<span class="count">${n}</span>`:""}</button>`;
  }).join("");
  const v = $("#view");
  if(!S.ready){ v.innerHTML = `<p class="empty">Cargando el estudio de mercado…</p>`; return; }
  if(!S.db && !S.items.length){ v.innerHTML = `<div class="notice">Esta vista no tiene acceso a la base de datos del estudio. Abre la página desde tu cuenta de claude.ai para ver y editar los inmuebles.</div>`; return; }
  if(S.tab==="panel") v.innerHTML = vistaPanel();
  else if(S.tab==="clientes") v.innerHTML = vistaClientes();
  else if(S.tab==="captaciones") v.innerHTML = vistaCaptaciones();
  else v.innerHTML = vistaZona();
}

    <div class="kpi"><span class="lbl">Datos confirmados</span><b class="num" style="color:var(--good)">${act.filter(i=>i.verificado).length}</b><small>revisados contra la publicación</small></div>

/* Vista de zona */
function filtrar(list){
  const f = S.f, q = f.q.trim().toLowerCase();
  return list.filter(i =>
    (f.op==="todas" || i.operacion===f.op) &&
    (f.st==="todos" || (f.st==="activos" ? ACTIVOS.includes(i.estatus) : i.estatus===f.st)) &&
    (!f.sector || i.sector===f.sector) &&
    (f.min==="" || (i.precio!=null && i.precio>=+f.min)) &&
    (f.max==="" || (i.precio!=null && i.precio<=+f.max)) &&
    (!q || [i.id,i.titulo,i.sector,i.subtipo,i.nota,i.descripcion].join(" ").toLowerCase().includes(q))
  );
}
function ordenar(rows){
  const o = S.f.orden, k = {
    puntaje:(a,b)=>(b.ev.score??-1)-(a.ev.score??-1),
    precio_asc:(a,b)=>(a.it.precio??1e15)-(b.it.precio??1e15),
    precio_desc:(a,b)=>(b.it.precio??-1)-(a.it.precio??-1),
    m2:(a,b)=>(ppm2(a.it)??1e15)-(ppm2(b.it)??1e15),
    recientes:(a,b)=>String(b.it.fecha_detectada).localeCompare(String(a.it.fecha_detectada)),
  }[o];
  return rows.sort(k);
}
function vistaZona(){

  const pm = act.map(ppm2).filter(x=>x!=null), precios = act.map(i=>i.precio).filter(Boolean);
  const exc = act.map(i=>evaluar(i)).filter(e=>e.clase==="exc").length;
  const sectores = [...new Set(deTipo.map(i=>i.sector))].sort();
  const f = S.f;
  const extraCol = S.tipo==="residencial" ? "Hab · Baños" : S.tipo==="terreno" ? "Zonificación" : S.tipo==="galpon" ? "Detalle" : "Ubicación";
  const extra = it => S.tipo==="residencial" ? `${it.hab??"—"} · ${it.banos??"—"}` :
    esc((it.specs||{})[S.tipo==="terreno"?"zonificacion":S.tipo==="galpon"?"divisible":"ubicacion"] || it.subtipo || "—");

  <nav class="types" role="tablist">${TIPOS.map(t=>`<button role="tab" data-tipo="${t.id}" aria-selected="${S.tipo===t.id}">${t.nombre} <span class="muted">${enZona.filter(i=>i.tipo===t.id && ACTIVOS.includes(i.estatus)).length}</span></button>`).join("")}</nav>

    <div class="kpi"><span class="lbl">Mediana $/m²</span><b class="num">${pm.length?usd(median(pm)):"—"}</b><small>${pm.length} con m² conocido</small></div>

    <div class="kpi"><span class="lbl">Excelentes</span><b class="num" style="color:var(--good)">${exc}</b><small>puntaje de 75 o más</small></div>

    <label>Sector<select id="f-sector"><option value="">Todos</option>${sectores.map(s=>`<option ${f.sector===s?"selected":""}>${esc(s)}</option>`).join("")}</select></label>
    <label>Precio mín.<input type="number" id="f-min" value="${esc(f.min)}" placeholder="20000"></label>
    <label>Precio máx.<input type="number" id="f-max" value="${esc(f.max)}" placeholder="Sin tope"></label>
    <label>Ordenar por<select id="f-orden">${[["puntaje","Mejor puntaje"],["precio_asc","Precio: menor a mayor"],["precio_desc","Precio: mayor a menor"],["m2","$/m² más bajo"],["recientes","Más recientes"]].map(([v,n])=>`<option value="${v}" ${f.orden===v?"selected":""}>${n}</option>`).join("")}</select></label>

      <td class="r num">${it.precio==null?'<span class="sub">Por confirmar</span>':`<b>${usd(it.precio)}</b>`}${it.operacion==="alquiler"&&it.precio!=null?'<div class="sub">al mes</div>':""}</td>
      <td class="r num">${fmt(area(it))}</td>
      <td class="r num">${ppm2(it)?usd(ppm2(it)):"—"}${d!=null?`<div class="delta ${d<0?"dn":"up"}">${d>0?"+":""}${d}%</div>`:""}</td>
      <td>${extra(it)}</td>
      <td class="r num">${dias(it.fecha_detectada)??"—"}</td>
      <td><span class="chip st-${it.estatus}">${stNom(it.estatus)}</span></td>
      <td>${ev.ref?'<span class="chip cl-ref">Referencia</span>':ev.falta?'<span class="chip cl-ref">Falta precio</span>':`<div class="score"><span class="bar"><i style="width:${ev.score}%;background:${claseColor[ev.clase]}"></i></span><b class="num">${ev.score}</b><span class="chip cl-${ev.clase}">${claseNom[ev.clase]}</span></div>`}</td>
    </tr>`;}).join("") || `<tr><td colspan="10" class="empty">No hay inmuebles con estos filtros.</td></tr>`}</tbody>
  </table></div>
  <p class="sub">El % debajo del $/m² compara con la mediana de sus comparables (verde: más barato). Toca una fila para ver la ficha completa, editarla o cambiar el estatus.</p>`;
}

/* ───────────── Ficha (drawer) ───────────── */
let D = null; // copia editable
function abrir(id, nuevo){
  if(nuevo){ D = nuevo; S.sel = "__nuevo"; }
  else { const it = S.items.find(i=>i.id===id); if(!it) return; D = JSON.parse(JSON.stringify(it)); S.sel = id; }
  D._conf = false; pintarDrawer();
}
function cerrar(){ S.sel=null; D=null; $("#drawer-root").innerHTML=""; }
function pintarDrawer(){
  if(!D) return;
  const ev = evaluar(D), sp = D.specs||{}, tpl = SPECS[D.tipo]||[];

function leerForm(){
  const v = id => { const el=$("#"+id); return el? el.value.trim() : undefined; };
  const n = id => { const x=v(id); return x===""||x==null? null : Number(x); };
  D.titulo=v("d-titulo"); D.zona=v("d-zona"); D.tipo=v("d-tipo"); D.subtipo=v("d-subtipo"); D.operacion=v("d-op"); D.sector=v("d-sector");
  D.precio=n("d-precio"); D.m2c=n("d-m2c"); D.m2t=n("d-m2t"); D.hab=n("d-hab"); D.banos=n("d-banos"); D.puestos=n("d-puestos");
  D.agente=v("d-agente"); D.contacto=v("d-contacto"); D.fecha_detectada=v("d-fecha")||D.fecha_detectada; D.ultima_verificacion=v("d-verif")||D.ultima_verificacion;
  D.descripcion=v("d-desc"); D.nota=v("d-nota");
  const sp = {...(D.specs||{})};
  document.querySelectorAll("[id^='sp-']").forEach(el=>{ const k=el.id.slice(3); if(el.value.trim()) sp[k]=el.value.trim(); else delete sp[k]; });
  D.specs = sp;
  if(D.propia){
    const c = D.captacion = {...(D.captacion||{})};
    c.exclusiva = v("cp-excl")!=="no"; c.fecha_captacion=v("cp-fecha"); c.vencimiento=v("cp-vence"); c.comision=n("cp-com"); c.precio_minimo=n("cp-min");
    c.propietario = {nombre:v("cp-pnom"), telefono:v("cp-ptel"), correo:v("cp-pmail")};
    const docs = {}; DOCS.forEach(([k])=>{ const el=$("#cd-"+k); if(el?.checked) docs[k]=true; }); c.docs = docs;
    D.estatus = (EST_CAP.find(e=>e.id===c.estado)||EST_CAP[0]).st;
  }
}
async function guardarDrawer(){
  leerForm();
  if(!D.titulo){ toast("Escribe un título para el inmueble"); return; }
  const prev = S.items.find(i=>i.id===D.id);
  D.historial = D.historial || [];
  if(!prev) D.historial.push({fecha:hoy(), evento:D.propia?"Nueva captación":"Agregado manualmente", precio:D.precio, estatus:D.estatus});
  else {
    if(prev.precio!==D.precio) D.historial.push({fecha:hoy(), evento:`Cambio de precio (antes ${usd(prev.precio)})`, precio:D.precio});
    if(prev.estatus!==D.estatus) D.historial.push({fecha:hoy(), evento:`Estatus: ${stNom(prev.estatus)} → ${stNom(D.estatus)}`});
    if(D.propia && prev.captacion?.estado!==D.captacion?.estado) D.historial.push({fecha:hoy(), evento:`Captación: ${capNom(prev.captacion?.estado)} → ${capNom(D.captacion?.estado)}`});
    if(!prev.verificado && D.verificado) D.historial.push({fecha:hoy(), evento:"Datos confirmados en la publicación"});
  }
  const it = {...D}; delete it._conf;
  if(await guardar(it)){ toast("Cambios guardados"); cerrar(); }
}

function coincidencias(c){
  const perfil = PERFILES[c.perfil] ? c.perfil : "general";
  return S.items.filter(i =>
    ACTIVOS.includes(i.estatus) &&
    (!c.operacion || c.operacion==="todas" || i.operacion===c.operacion) &&
    (!c.zonas?.length || c.zonas.includes(i.zona)) &&
    (!c.tipos?.length || c.tipos.includes(i.tipo)) &&
    (c.min==null || c.min==="" || (i.precio!=null && i.precio>=c.min)) &&
    (c.max==null || c.max==="" || (i.precio!=null && i.precio<=c.max)) &&
    (!c.hab || i.tipo!=="residencial" || (i.hab||0)>=c.hab) &&
    (!c.m2 || (area(i)||0)>=c.m2)
  ).map(it=>({it, ev:evaluar(it, perfil)})).sort((a,b)=>(!!b.it.propia-!!a.it.propia) || (b.ev.score??-1)-(a.ev.score??-1));
}

        <div class="form">
          <label class="wide">Nombre<input id="c-nombre" value="${esc(form.nombre)}"></label>
          <label class="wide">Perfil de inversionista<select id="c-perfil">${Object.entries(PERFILES).map(([k,p])=>`<option value="${k}" ${form.perfil===k?"selected":""}>${p.nombre}</option>`).join("")}</select></label>
          <label>Operación<select id="c-op">${[["venta","Compra"],["alquiler","Alquiler"],["todas","Ambas"]].map(([v,n])=>`<option value="${v}" ${form.operacion===v?"selected":""}>${n}</option>`).join("")}</select></label>
          <label>Hab. mínimas<input id="c-hab" type="number" value="${esc(form.hab)}"></label>
          <label>Presupuesto mín.<input id="c-min" type="number" value="${esc(form.min)}"></label>
          <label>Presupuesto máx.<input id="c-max" type="number" value="${esc(form.max)}"></label>
          <label>m² mínimos<input id="c-m2" type="number" value="${esc(form.m2)}"></label>
          <label class="wide">Zonas<span class="checks">${ZONAS.map(z=>`<label><input type="checkbox" name="c-z" value="${z.id}" ${form.zonas?.includes(z.id)?"checked":""}>${z.nombre}</label>`).join("")}</span></label>
          <label class="wide">Tipos<span class="checks">${TIPOS.map(t=>`<label><input type="checkbox" name="c-t" value="${t.id}" ${form.tipos?.includes(t.id)?"checked":""}>${t.nombre}</label>`).join("")}</span></label>
          <label class="wide">Qué busca (notas)<textarea id="c-notas">${esc(form.notas)}</textarea></label>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn primary" type="button" id="c-save">${c?"Guardar perfil":"Crear cliente"}</button>${c?`<button class="btn danger" type="button" id="c-del">Eliminar cliente</button>`:""}</div>
      </div>
    </div>
    <div class="card"><h2>${c?`Inmuebles para ${esc(c.nombre)}`:"Coincidencias"}</h2>
      ${c?`<p class="sub">Ordenados con los pesos del perfil <b>${esc(PERFILES[c.perfil]?.nombre)}</b>. Marca los que quieras enviarle y copia la ficha para el cliente: solo incluye datos publicables, sin tus notas internas.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn primary sm" type="button" id="c-copy">Copiar ficha para el cliente (${[...S.pick].filter(id=>ms.some(m=>m.it.id===id)).length})</button></div>
      <div class="tablebox"><table style="min-width:640px"><thead><tr><th></th><th>Inmueble</th><th class="r">Precio</th><th class="r">m²</th><th>Estatus</th><th class="r">Puntaje</th></tr></thead><tbody>
      ${ms.map(({it,ev})=>`<tr data-open="${esc(it.id)}"><td><input type="checkbox" data-pick="${esc(it.id)}" ${S.pick.has(it.id)?"checked":""} aria-label="Seleccionar ${esc(it.id)}"></td>
        <td><div class="tt">${it.propia?'<span class="mine">Mi captación · </span>':""}${esc(it.titulo)}</div><div class="sub">${esc(zonaNom(it.zona))} · ${esc(it.sector)} · <span class="mono">${esc(it.id)}</span></div></td>
        <td class="r num"><b>${usd(it.precio)}</b></td><td class="r num">${fmt(area(it))}</td>
        <td><span class="chip st-${it.estatus}">${stNom(it.estatus)}</span></td>
        <td>${ev.ref?'<span class="chip cl-ref">Ref.</span>':ev.falta?'<span class="chip cl-ref">Falta precio</span>':`<div class="score"><b class="num">${ev.score}</b><span class="chip cl-${ev.clase}">${claseNom[ev.clase]}</span></div>`}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">Ningún inmueble activo cumple estos criterios.</td></tr>`}
      </tbody></table></div>`:`<p class="muted">Crea o elige un cliente: cuando dices "llegó un inversionista que busca esto", aquí aparecen los inmuebles del estudio que le sirven, ordenados según su perfil.</p>`}
    </div></div>`;
}
function leerCliente(){
  const v = id => $("#"+id).value.trim(), n = id => v(id)===""? "" : Number(v(id));
  return {nombre:v("c-nombre"), perfil:v("c-perfil"), operacion:v("c-op"), hab:n("c-hab"), min:n("c-min"), max:n("c-max"), m2:n("c-m2"), notas:v("c-notas"),
    zonas:[...document.querySelectorAll("input[name=c-z]:checked")].map(x=>x.value), tipos:[...document.querySelectorAll("input[name=c-t]:checked")].map(x=>x.value)};
}
function fichaCliente(c){
  const sel = coincidencias(c).filter(m=>S.pick.has(m.it.id));
  const lines = [`Hola ${c.nombre}, te comparto inmuebles seleccionados según lo que buscas:`, ""];
  sel.forEach(({it},i)=>{
    const sp = it.specs||{};
    const det = [it.hab?`${it.hab} hab.`:"", it.banos?`${it.banos} baños`:"", it.puestos?`${it.puestos} puestos`:"", area(it)?`${fmt(area(it))} m²`:""].filter(Boolean).join(" · ");
    const dest = Object.values(sp).slice(0,3).join(" · ");
    lines.push(`${i+1}. ${it.titulo}`, `   📍 ${it.sector}, ${zonaNom(it.zona)}`, `   💵 ${usd(it.precio)}${it.operacion==="alquiler"?" al mes":""}${det?"  |  "+det:""}`);
    if(dest) lines.push(`   ✔ ${dest}`);
    lines.push("");
  });
  lines.push("¿Te gustaría agendar una visita a alguno?", "", FIRMA);
  return lines.join("\n");
}

/* ───────────── Exportar a Excel ───────────── */
async function exportar(){
  if(!window.XLSX){ toast("No se pudo cargar el generador de Excel"); return; }
  if(!S.dl){ toast("Esta vista no permite descargar archivos"); return; }
  const wb = XLSX.utils.book_new();
  const fila = it => { const ev=evaluar(it); return {
    "Código":it.id, "Tipo":tipoNom(it.tipo), "Subtipo":it.subtipo, "Operación":it.operacion, "Sector":it.sector, "Título":it.titulo,
    "Precio USD":it.precio, "Datos confirmados":it.verificado?"Sí":"No", "m² construcción":it.m2c, "m² terreno":it.m2t, "$/m²":ppm2(it)?Math.round(ppm2(it)):null,
    "Habitaciones":it.hab, "Baños":it.banos, "Puestos":it.puestos, "Estatus":stNom(it.estatus),
    "Puntaje":ev.ref||ev.falta?"":ev.score, "Calificación":ev.ref?"Referencia":ev.falta?"Falta precio":claseNom[ev.clase], "Análisis":it.nota,
    "Características":Object.entries(it.specs||{}).map(([k,v])=>k.replace(/_/g," ")+": "+v).join(" | "),
    "Fuente":(it.fuentes||[]).map(s=>s.nombre+(s.codigo?" "+s.codigo:"")).join(" | "), "Enlace":(it.fuentes||[])[0]?.url||"",
    "Detectado":it.fecha_detectada, "Últ. verificación":it.ultima_verificacion, "Días en mercado":dias(it.fecha_detectada) }; };
  const res = [];
  for(const z of ZONAS) for(const t of TIPOS){ const g=S.items.filter(i=>i.zona===z.id&&i.tipo===t.id&&ACTIVOS.includes(i.estatus));
    const pm=g.map(ppm2).filter(x=>x!=null); res.push({"Zona":z.nombre,"Tipo":t.nombre,"Activos":g.length,"Mediana $/m²":pm.length?Math.round(median(pm)):null,
      "Excelentes":g.map(i=>evaluar(i)).filter(e=>e.clase==="exc").length}); }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(res), "Resumen");
  for(const z of ZONAS){
    const rows = S.items.filter(i=>i.zona===z.id).sort((a,b)=>a.tipo.localeCompare(b.tipo)||a.id.localeCompare(b.id)).map(fila);
    const ws = XLSX.utils.json_to_sheet(rows); ws["!cols"] = Object.keys(rows[0]||{}).map(k=>({wch:Math.min(40,Math.max(10,k.length+2))}));
    XLSX.utils.book_append_sheet(wb, ws, z.nombre);
  }
  const caps = S.items.filter(i=>i.propia).map(it=>{ const c=it.captacion||{}, a=acm(it); return {
    "Código":it.id, "Zona":zonaNom(it.zona), "Tipo":tipoNom(it.tipo), "Operación":it.operacion, "Sector":it.sector, "Título":it.titulo,
    "Estado":capNom(c.estado), "Contrato":c.exclusiva===false?"No exclusiva":"Exclusiva", "Captado el":c.fecha_captacion, "Vence":c.vencimiento,
    "Precio USD":it.precio, "Precio mínimo":c.precio_minimo, "Sugerido ACM":a&&!a.pocos?Math.round(a.sugerido):null, "Comisión %":c.comision,
    "m² construcción":it.m2c, "m² terreno":it.m2t, "Habitaciones":it.hab, "Baños":it.banos, "Puestos":it.puestos,
    "Propietario":c.propietario?.nombre, "Teléfono":c.propietario?.telefono, "Correo":c.propietario?.correo,
    "Documentos":DOCS.filter(([k])=>c.docs?.[k]).map(([,n])=>n).join(" | "),
    "Visitas":(c.actividad||[]).filter(x=>x.tipo==="Visita").length, "Ofertas":(c.actividad||[]).filter(x=>x.tipo==="Oferta").length, "Notas":it.nota }; });
  if(caps.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(caps), "Mis captaciones");
  const buf = XLSX.write(wb, {type:"array", bookType:"xlsx"});
  try{ await S.dl.save({filename:`Estudio de Mercado ${hoy()}.xlsx`, data:new Blob([buf])}); toast("Excel descargado"); }
  catch(e){ if(e.code!=="declined") toast("No se pudo descargar: " + e.code); }
}

/* ───────────── Eventos ───────────── */
document.addEventListener("click", async e => {
  const t = e.target.closest("button,[data-open],[data-go],input[type=checkbox]");
  if(!t) { if(e.target.id==="ov") cerrar(); return; }
  if(t.dataset.tab){ S.tab=t.dataset.tab; S.f.sector=""; try{localStorage.setItem("em-tab",S.tab)}catch(_){ } render(); return; }
  if(t.dataset.tipo){ S.tipo=t.dataset.tipo; S.f.sector=""; try{localStorage.setItem("em-tipo",S.tipo)}catch(_){ } render(); return; }
  if(t.dataset.go){ const [z,ti]=t.dataset.go.split("|"); S.tab=z; S.tipo=ti; render(); return; }
  if(t.dataset.pick){ t.checked?S.pick.add(t.dataset.pick):S.pick.delete(t.dataset.pick); e.stopPropagation(); render(); return; }
  if(t.matches("input[type=checkbox]")) return;
  if(t.dataset.open){ abrir(t.dataset.open); return; }
  if(t.dataset.cli){ S.cliente=t.dataset.cli; S.pick.clear(); render(); return; }
  switch(t.id){
    case "btn-add": abrir(null, S.tab==="captaciones" ? plantillaCaptacion() : plantilla()); return;
    case "cap-new": abrir(null, plantillaCaptacion()); return;
    case "ca-add": { leerForm(); const tipo=$("#ca-tipo").value, fecha=$("#ca-fecha").value||hoy(), det=$("#ca-det").value.trim(), m=$("#ca-monto").value;
      D.captacion.actividad=[...(D.captacion.actividad||[]), {fecha, tipo, detalle:det, monto:m===""?null:Number(m)}]; pintarDrawer(); toast("Actividad agregada: guarda los cambios"); return; }
    case "btn-export": exportar(); return;
    case "d-close": case "d-cancel": cerrar(); return;
    case "d-save": guardarDrawer(); return;
    case "d-del": leerForm(); D._conf=true; pintarDrawer(); return;
    case "d-del0": D._conf=false; pintarDrawer(); return;
    case "d-del2": if(S.db){ try{ await S.db.collection("inmuebles").doc(D.id).delete(); toast("Inmueble eliminado"); cerrar(); }catch(err){ toast("No se pudo eliminar: "+err.code); } } return;
    case "d-addsrc": { leerForm(); const nombre=$("#ns-nombre").value.trim(), url=$("#ns-url").value.trim(), codigo=$("#ns-codigo").value.trim();
      if(!url){ toast("Pega el enlace de la publicación"); return; }
      D.fuentes=[...(D.fuentes||[]), {nombre:nombre||"Enlace", codigo, url}]; pintarDrawer(); return; }
    case "c-new": S.cliente=null; S.pick.clear(); render(); return;
    case "c-save": { const data=leerCliente(); if(!data.nombre){ toast("Escribe el nombre del cliente"); return; }
      if(!S.db){ toast("No hay base de datos"); return; }
      const ref = S.cliente ? S.db.collection("clientes").doc(S.cliente) : S.db.collection("clientes").doc();
      try{ await ref.set({...data, actualizado:hoy()}); S.cliente=ref.id; toast("Perfil guardado"); render(); }catch(err){ toast("No se pudo guardar: "+err.code); } return; }
    case "c-del": if(S.db && S.cliente){ try{ await S.db.collection("clientes").doc(S.cliente).delete(); S.cliente=null; toast("Cliente eliminado"); render(); }catch(err){ toast("No se pudo eliminar: "+err.code); } } return;
    case "c-copy": { const c=S.clientes.find(x=>x.id===S.cliente); if(!c) return; if(![...S.pick].length){ toast("Marca al menos un inmueble"); return; }
      const txt=fichaCliente(c);
      try{ await navigator.clipboard.writeText(txt); toast("Ficha copiada: pégala en WhatsApp o en un correo"); }
      catch(_){ abrirTexto(txt); } return; }
  }
  if(t.dataset.cap){ leerForm(); D.captacion.estado=t.dataset.cap; D.estatus=(EST_CAP.find(e=>e.id===t.dataset.cap)||EST_CAP[0]).st; pintarDrawer(); return; }
  if(t.dataset.openCmp){ abrir(t.dataset.openCmp); return; }
  if(t.dataset.st){ leerForm(); D.estatus=t.dataset.st; if(D.estatus!=="por_verificar") D.ultima_verificacion=hoy(); pintarDrawer(); return; }
  if(t.hasAttribute("data-fav")){ leerForm(); D.favorito=!D.favorito; pintarDrawer(); return; }
  if(t.hasAttribute("data-verif")){ leerForm(); D.verificado=!D.verificado; if(D.verificado) D.ultima_verificacion=hoy(); pintarDrawer(); return; }
  if(t.dataset.rate){ leerForm(); D.cal={...(D.cal||{}), [t.dataset.rate]:+t.dataset.v}; pintarDrawer(); return; }
  if(t.dataset.delsrc){ leerForm(); D.fuentes=D.fuentes.filter((_,i)=>i!==+t.dataset.delsrc); pintarDrawer(); return; }
});
function abrirTexto(txt){
  $("#drawer-root").innerHTML = `<div class="overlay" id="ov"><aside class="drawer"><div class="dhead"><h2>Ficha para el cliente</h2><button class="btn sm" id="d-close" type="button">Cerrar ✕</button></div>
  <p class="sub">No se pudo copiar automáticamente. Selecciona el texto y cópialo.</p><div class="form"><label class="wide"><textarea id="txt-ficha" style="min-height:60vh">${esc(txt)}</textarea></label></div></aside></div>`;
  const ta=$("#txt-ficha"); ta.focus(); ta.select();
}
document.addEventListener("input", e => {
  const id = e.target.id; const map = {"f-q":"q","f-min":"min","f-max":"max"};
  if(map[id]){ S.f[map[id]] = e.target.value; clearTimeout(S._deb); S._deb=setTimeout(()=>{ const pos=e.target.selectionStart; render(); const el=$("#"+id); if(el){ el.focus(); try{el.setSelectionRange(pos,pos)}catch(_){} } }, 250); }
});
document.addEventListener("change", e => {
  const id = e.target.id; const map = {"f-op":"op","f-st":"st","f-sector":"sector","f-orden":"orden"};
  if(map[id]){ S.f[map[id]] = e.target.value; render(); }
  if((id==="d-tipo"||id==="d-op"||id==="d-zona") && D){ leerForm(); if(id==="d-zona" && S.sel==="__nuevo" && !D.propia) D.id=nuevoId(D.zona); pintarDrawer(); }
});
document.addEventListener("keydown", e => { if(e.key==="Escape" && S.sel) cerrar(); });
iniciar();
</script>
