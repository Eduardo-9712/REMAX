<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica,Arial,sans-serif">
<rect width="900" height="640" fill="#0b0b0f"/>
<text x="450" y="34" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">PLANO ESQUEMÁTICO · GTE Sport Club · Guatire</text>
<text x="450" y="56" text-anchor="middle" fill="#9aa" font-size="13">Vista desde arriba · SIN ESCALA · posiciones aproximadas según los videos · medidas por confirmar</text>
<!-- calles -->
<rect x="40" y="560" width="820" height="50" fill="#2a2a30"/><text x="450" y="591" text-anchor="middle" fill="#ccc" font-size="14">CALLE FRONTAL (fachada GTE, bordillo amarillo)</text>
<rect x="800" y="80" width="60" height="480" fill="#2a2a30"/><text transform="translate(836,320) rotate(90)" text-anchor="middle" fill="#ccc" font-size="14">AVENIDA LATERAL (esquina)</text>
<!-- lote -->
<rect x="60" y="90" width="720" height="460" fill="#15151b" stroke="#e11d2e" stroke-width="3" stroke-dasharray="8 5"/>
<text x="70" y="110" fill="#e11d2e" font-size="12">Límite del lote · cerca de malla negra y bloques</text>
<!-- fachada -->
<rect x="90" y="520" width="200" height="26" fill="#111" stroke="#fff"/><text x="190" y="538" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">FACHADA GTE (contenedores)</text>
<rect x="290" y="520" width="60" height="26" fill="none" stroke="#3aa0ff" stroke-width="2" stroke-dasharray="4 3"/><text x="320" y="564" text-anchor="middle" fill="#3aa0ff" font-size="11">▲ PORTÓN</text>
<!-- plaza -->
<rect x="290" y="380" width="230" height="130" fill="#3a3327" stroke="#a89468"/><text x="405" y="445" text-anchor="middle" fill="#e8dcc0" font-size="13">PLAZA DE ADOQUINES</text>
<rect x="360" y="470" width="50" height="30" rx="6" fill="#fff" stroke="#e91e8c" stroke-width="3"/><text x="385" y="490" text-anchor="middle" font-size="9" fill="#111">TAQUILLA</text>
<!-- restaurante -->
<rect x="90" y="330" width="180" height="180" fill="#3b2a55" stroke="#b58cff" stroke-width="2"/>
<text x="180" y="392" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">RESTAURANTE</text>
<text x="180" y="410" text-anchor="middle" fill="#ddd" font-size="11">2 niveles · contenedores con murales</text>
<text x="180" y="432" text-anchor="middle" fill="#fff" font-size="11">Nivel 1: restaurante cerrado</text>
<text x="180" y="448" text-anchor="middle" fill="#fff" font-size="11">Nivel 2: terraza bar techada</text>
<text x="180" y="470" text-anchor="middle" fill="#b58cff" font-size="10">(vistas a canchas y montaña)</text>
<!-- canchas azules techadas -->
<rect x="540" y="380" width="230" height="140" fill="#12306b" stroke="#3aa0ff" stroke-width="2"/>
<text x="655" y="440" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">PÁDEL AZUL TECHADO</text>
<text x="655" y="458" text-anchor="middle" fill="#cfe" font-size="11">canchas techadas · grama verde</text>
<text x="655" y="474" text-anchor="middle" fill="#cfe" font-size="11">marca Solera Pádel · escalera</text>
<!-- canchas rojas -->
<rect x="290" y="220" width="480" height="140" fill="#7a1420" stroke="#ff4d5e" stroke-width="2"/>
<text x="530" y="272" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">PÁDEL ROJO · aire libre</text>
<text x="530" y="290" text-anchor="middle" fill="#ffd" font-size="11">incluye cancha de cristal "Stadium"</text>
<text x="530" y="306" text-anchor="middle" fill="#ffd" font-size="11">malla negra · gradas turquesa y rosa</text>
<text x="530" y="322" text-anchor="middle" fill="#ffd" font-size="10">Total pádel según Eduardo: 4 canchas</text>
<!-- lounge -->
<rect x="90" y="220" width="180" height="90" fill="#333" stroke="#ddd" stroke-dasharray="3 3"/>
<text x="180" y="256" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">LOUNGE TECHADO</text>
<text x="180" y="274" text-anchor="middle" fill="#ccc" font-size="11">sofás · mesas con sombrillas</text>
<!-- pickleball -->
<rect x="470" y="120" width="300" height="80" fill="#5b8bd9" stroke="#e91e8c" stroke-width="3"/>
<text x="620" y="152" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">PICKLEBALL</text>
<text x="620" y="170" text-anchor="middle" fill="#fff" font-size="11">azul y rosado · cerco bajo</text>
<text x="620" y="186" text-anchor="middle" fill="#fff" font-size="11">letrero Digitel</text>
<rect x="90" y="120" width="340" height="80" fill="none"/>
<text x="260" y="160" text-anchor="middle" fill="#7d7d88" font-size="12">Zona de cierre del lote (esquina)</text>
<text x="260" y="176" text-anchor="middle" fill="#7d7d88" font-size="11">edificio de ladrillo rojo visible al fondo</text>
<!-- brujula -->
<text x="60" y="76" fill="#e11d2e" font-size="12">⚠ Orientación (norte) por confirmar</text>
<!-- alrededores -->
<text x="450" y="626" text-anchor="middle" fill="#9aa" font-size="12">Detrás de la Toyota · Av. Intercomunal · C.C. La Parada · C.C. Buenaventura · C.C. Mega Center · Luna Park · lotes vecinos</text>
</svg>
